# Cloudflare Pages project settings. See ADMIN-SETUP.md for how to fill in the ids on launch day.
name = "ev-company"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "EV_CONTENT"
id = "73126c9555b04f56b58f432d5337bba9"

# Photos (R2). Switched on once the bucket "ev-company-media" exists; until then photo upload says it is not active yet.
# [[r2_buckets]]
# binding = "EV_MEDIA"
# bucket_name = "ev-company-media"

[vars]
# ACCESS_TEAM_DOMAIN, ACCESS_AUD and ADMIN_EMAILS are set in the Cloudflare dashboard (Settings → Variables).
